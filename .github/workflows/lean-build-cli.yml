name: Lean build CLI audit

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - copilot/add-build-cli-for-lean-project

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned Lean toolchain
        run: |
          set -euxo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \
            sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache when available
        run: lake exe cache get || true
      - name: Build project directly
        run: lake build
      - name: Audit CLI
        run: |
          chmod +x ./leanc2
          ./leanc2 --help
          ./leanc2 check
